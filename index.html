<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Arish's Birthday Drinks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#17111f; --stub:#241a30; --line:#3b2d4a; --fg:#f6efe4; --muted:#b4a6c2;
  --gold:#f0bf5a; --goldbg:#3a2c14; --ok:#7ad6a0; --okbg:#1d3a2b;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
:root.dj{--bg:#08191c;--stub:#0f2a2f;--line:#1f4a50;--muted:#9cc3c4;--gold:#5fe0d4;--goldbg:#12403f}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px}
#app{max-width:440px;margin:0 auto}
.stub{background:var(--stub);border:1px solid var(--line);border-radius:22px;padding:28px 24px;position:relative;display:flex;flex-direction:column;gap:14px;text-align:center}
.stub::before,.stub::after{content:"";position:absolute;top:58%;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub::before{left:-12px;clip-path:inset(0 0 0 50%)} .stub::after{right:-12px;clip-path:inset(0 50% 0 0)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.msg{color:var(--muted);margin:0;text-wrap:pretty}
.tear{border-top:2px dashed var(--line);margin:10px -24px 4px}
.token{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15;color:var(--gold);text-wrap:balance}
.token.done{color:var(--ok)}
.sub{font-size:15px;color:var(--fg);margin:0}
.sig{font-family:var(--display);font-weight:800;font-size:20px;color:var(--gold)}
.badge{align-self:center;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge.ready{background:var(--goldbg);color:var(--gold)} .badge.done{background:var(--okbg);color:var(--ok)}
</style>
</head>
<body>
<main id="app"></main>
<script id="state" type="application/json">{"guests":[{"t":"p-3r88jfx3","name":"Demo Guest","collected":false},{"t":"p-ummaw2jp","name":"Rishab Kanwal","collected":false},{"t":"p-wskl3doo","name":"Prateek Arora","collected":false},{"t":"p-o20xdq59","name":"Anna Teslenko","collected":false},{"t":"p-2oexjjcf","name":"Sibel Merlet","collected":false},{"t":"p-d7dw8ax4","name":"Harsh Malik","collected":false},{"t":"p-vg14n89x","name":"Jaina Abdul Mansour","collected":false},{"t":"p-ystagkga","name":"Sagar Rathi","collected":false},{"t":"p-el7phtod","name":"Huzefa Chunawala","collected":false},{"t":"p-zkufj2o5","name":"Amar","collected":true},{"t":"d-blcsccrk","name":"DJ A/TAG","dj":true},{"t":"d-jtyracb0","name":"DJ LAUTASTIC","dj":true},{"t":"d-xmza830z","name":"DJ LEZCANO","dj":true},{"t":"d-33d2peyh","name":"DJ LUCHO","dj":true},{"t":"d-hwwlki84","name":"DJ DYLAN GOUGH","dj":true},{"t":"d-11gpuc5c","name":"DJ ŒTTIE","dj":true},{"t":"d-qbwa8qpb","name":"DJ DUNGEON MAGISTER","dj":true}]}</script>
<script>
(function(){
  const state = JSON.parse(document.getElementById('state').textContent);
  const app = document.getElementById('app');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  function render(){
    const g = state.guests.find(x => '#' + x.t === location.hash);
    document.documentElement.classList.toggle('dj', !!(g && g.dj));
    const s = el('section', 'stub');
    s.append(el('div', 'eyebrow', "Arish's Birthday"));
    if (!g){
      s.append(el('h1', '', 'Welcome!'), el('p', 'msg', 'Scan the QR code on your pass to see your drink.'));
    } else if (g.dj){
      s.append(el('h1', '', 'Hey ' + g.name + '!'),
        el('div', 'tear'),
        el('div', 'token', "You're on the decks at 9HRS"),
        el('p', 'msg', "Thank you for bringing the music and the energy. You're the reason this party comes alive. I'm so grateful you're here. Now go make some noise."),
        el('p', 'sub sig', '– Arish'),
        el('span', 'badge ready', 'DJ pass'));
    } else if (!g.collected){
      const first = g.name.split(' ')[0];
      s.append(el('h1', '', 'Hey ' + first + ', welcome!'),
        el('p', 'msg', 'Thanks for joining us today.'),
        el('div', 'tear'),
        el('div', 'token', 'Please collect a drink from Arish'),
        el('p', 'sub', "And don't forget to enjoy yourself!"),
        el('span', 'badge ready', '1 drink'));
    } else {
      const first = g.name.split(' ')[0];
      s.append(el('h1', '', 'Hey ' + first + '!'),
        el('div', 'tear'),
        el('div', 'token done', 'Drink token collected'),
        el('p', 'sub', 'Hope you enjoyed your drink!'),
        el('span', 'badge done', 'Drink taken'));
    }
    app.replaceChildren(s);
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
